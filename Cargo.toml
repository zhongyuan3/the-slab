[package]
name = "the-slab"
version = "0.1.0"
edition = "2024"
description = "A no_std reimplementation of the Linux kernel's SLUB-style slab allocator"
license = "MIT"
repository = "https://github.com/zhongyuan3/the-slab"
readme = "README.md"
documentation = "https://docs.rs/the-slab"
keywords = ["no-std", "memory-allocator", "slab-allocator"]
categories = ["no-std", "memory-management"]
rust-version = "1.85"

[dependencies]
the-mm-core = { path = "../the-mm-core", version = "0.1.0" }
the-buddy-system = { path = "../the-buddy-system", version = "0.1.0", optional = true }

[features]
default = []
# Buddy adapters: `BuddyPages` and `Zone` implement `PageAlloc`.
buddy = ["dep:the-buddy-system"]

[dev-dependencies]
# Integration tests exercise the explicit boot handoff; the slab library
# itself has no memblock dependency.
the-memblock = { path = "../the-memblock", version = "0.2.0" }
